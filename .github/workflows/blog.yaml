name: deploy

# main 分支保存源码；构建结果发布到 gh-pages 分支。
# 首次部署前请到 GitHub 仓库 Settings > Pages：
#   Source = Deploy from a branch
#   Branch = gh-pages / (root)
on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.131.0"
          extended: true

      - name: Build Web
        # 不传 -D，草稿不会发布到线上
        run: hugo --minify --gc

      - name: Deploy Web
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./public
          force_orphan: true
          commit_message: "auto deploy ${{ github.sha }}"
