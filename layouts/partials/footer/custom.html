<!-- 阅读进度 -->
<div id="reading-progress" aria-hidden="true"></div>
<style>
  #reading-progress {
    position: fixed;
    top: 0;
    left: 0;
    width: 0;
    height: 2px;
    background: var(--academic-accent, #1f4e79);
    z-index: 9999;
    transition: width 0.08s linear;
  }
</style>
<script>
  (function () {
    const bar = document.getElementById('reading-progress');
    if (!bar) return;

    function updateProgress() {
      const root = document.documentElement;
      const max = root.scrollHeight - root.clientHeight;
      bar.style.width = (max > 0 ? (root.scrollTop / max) * 100 : 0) + '%';
    }

    document.addEventListener('scroll', updateProgress, { passive: true });
    window.addEventListener('resize', updateProgress);
    updateProgress();
  })();
</script>

{{- $motion := resources.Get "js/academic-motion.js" | minify | fingerprint "sha256" -}}
<script type="text/javascript" src="{{ $motion.RelPermalink }}" integrity="{{ $motion.Data.Integrity }}" defer></script>

<!-- 回到顶部 -->
<button id="backTopBtn" type="button" aria-label="回到顶部">↑</button>
<style>
  #backTopBtn {
    position: fixed;
    right: 24px;
    bottom: 24px;
    width: 38px;
    height: 38px;
    display: grid;
    place-items: center;
    border: 1px solid var(--academic-rule, #d4dce3);
    border-radius: 2px;
    background: var(--card-background, #ffffff);
    color: var(--card-text-color-main, #17212b);
    font-family: Georgia, serif;
    font-size: 18px;
    line-height: 1;
    cursor: pointer;
    opacity: 0;
    pointer-events: none;
    transform: translateY(8px);
    transition: opacity 0.2s ease, transform 0.2s ease,
        background 0.2s ease;
    z-index: 99;
  }

  #backTopBtn.is-visible {
    opacity: 1;
    pointer-events: auto;
    transform: translateY(0);
  }

  #backTopBtn:hover {
    background: var(--academic-paper-deep, #e2e9ee);
    transform: translateY(-1px);
  }

  #backTopBtn:focus-visible {
    outline: 1px solid var(--academic-accent, #1f4e79);
    outline-offset: 3px;
  }

  @media (max-width: 767px) {
    #backTopBtn {
      right: 16px;
      bottom: 16px;
    }
  }
</style>
<script>
  (function () {
    const btn = document.getElementById('backTopBtn');
    if (!btn) return;

    function syncVisibility() {
      btn.classList.toggle('is-visible', window.scrollY > 420);
    }

    btn.addEventListener('click', function () {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
    document.addEventListener('scroll', syncVisibility, { passive: true });
    syncVisibility();
  })();
</script>
