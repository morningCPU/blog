<!-- 阅读进度 -->
<div id="reading-progress" aria-hidden="true"></div>
<style>
  #reading-progress {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: 2px;
    background: var(--academic-accent);
    transform: scaleX(0);
    transform-origin: left center;
    transition: transform 0.08s linear;
    z-index: 9999;
  }
</style>
<script>
  (function () {
    const bar = document.getElementById('reading-progress');
    if (!bar) return;

    function updateProgress() {
      const root = document.documentElement;
      const max = root.scrollHeight - root.clientHeight;
      const ratio = max > 0 ? root.scrollTop / max : 0;
      bar.style.transform = 'scaleX(' + ratio + ')';
    }

    document.addEventListener('scroll', updateProgress, { passive: true });
    window.addEventListener('resize', updateProgress);
    updateProgress();
  })();
</script>

<!-- 回到顶部 -->
<button id="backTopBtn" type="button" aria-label="回到顶部">↑</button>
<style>
  #backTopBtn {
    position: fixed;
    right: var(--space-lg, 24px);
    bottom: var(--space-lg, 24px);
    width: 40px;
    height: 40px;
    display: grid;
    place-items: center;
    border: 1px solid var(--academic-rule);
    border-radius: 2px;
    background: var(--academic-card);
    color: var(--academic-ink-soft);
    font-family: var(--academic-sans);
    font-size: 18px;
    line-height: 1;
    cursor: pointer;
    opacity: 1;
    transform: translateY(0);
    transition: opacity 0.2s ease, transform 0.2s ease,
        background-color 0.2s ease, border-color 0.2s ease;
    z-index: 99;
  }

  #backTopBtn.is-hidden {
    opacity: 0;
    pointer-events: none;
    transform: translateY(8px);
  }

  #backTopBtn:hover {
    background: var(--academic-paper-deep);
    border-color: var(--academic-rule-strong);
    color: var(--academic-ink);
  }

  #backTopBtn:active {
    transform: translateY(1px);
  }

  #backTopBtn:focus-visible {
    outline: 2px solid var(--academic-accent);
    outline-offset: 2px;
  }

  @media (max-width: 767px) {
    #backTopBtn {
      right: var(--space-md, 16px);
      bottom: var(--space-md, 16px);
    }
  }
</style>
<script>
  (function () {
    const btn = document.getElementById('backTopBtn');
    if (!btn) return;

    function syncVisibility() {
      btn.classList.toggle('is-hidden', window.scrollY <= 420);
    }

    btn.addEventListener('click', function () {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
    document.addEventListener('scroll', syncVisibility, { passive: true });
    syncVisibility();
  })();
</script>
