{{- $query := first 1 (where .Context.Site.Pages "Layout" "==" "search") -}}
{{- if $query -}}
    {{- $searchPage := index $query 0 -}}
    <form action="{{ $searchPage.RelPermalink }}" class="search-form widget" role="search" {{ with .OutputFormats.Get "json" -}}data-json="{{ .Permalink }}" {{- end }}>
        <p>
            <label for="search-keyword">{{ T "search.title" }}</label>
            <input id="search-keyword" name="keyword" type="search" required
                autocomplete="off" inputmode="search"
                placeholder="{{ T `search.placeholder` }}" />
            <button type="submit" title="{{ T `search.title` }}" aria-label="{{ T `search.title` }}">
                {{ partial "helper/icon" "search" }}
            </button>
        </p>
    </form>
{{- else -}}
    {{- warnf "Search page not found. Create a page with layout: search." -}}
{{- end -}}
